<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPACT - Metabolomics Peak Analysis Computational Tool</title>
  <!-- The desktop application's own icon, copied byte for byte from
       mpact/icontranscolorless_L50_icon.ico. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="/styles/app.css">
  <!-- Plotly renders every chart. Loaded from cdnjs by default; run
       scripts/fetch_web_vendor.py to vendor it into /vendor for an
       air-gapped deployment, which this loader prefers when present. -->
  <script>
    (function loadPlotly() {
      var local = document.createElement('script');
      local.src = '/vendor/plotly.min.js';
      local.onerror = function () {
        var cdn = document.createElement('script');
        cdn.src = 'https://cdnjs.cloudflare.com/ajax/libs/plotly.js/4.0.0/plotly.min.js';
        cdn.onerror = function () { window.__plotlyFailed = true; };
        document.head.appendChild(cdn);
      };
      document.head.appendChild(local);
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <img class="app-icon" src="/assets/mpact-icon.png" alt="">
      <div class="brand">M<span>PACT</span></div>
      <div class="muted" style="font-size:12px">Metabolomics Peak Analysis Computational Tool</div>
      <div class="spacer"></div>
      <div id="run-chip" class="run-chip">No analysis</div>
      <button class="btn small" id="btn-runs">Runs</button>
    </header>

    <div class="body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
    </div>

    <div id="statusbar-host"></div>
  </div>

  <div class="toast-host" id="toasts"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
