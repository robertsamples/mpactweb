<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPACT</title>
<meta name="description" content="MPACT: processing and visual exploration of untargeted LC-MS metabolomics data, in Browser.">
<link rel="icon" href="/favicon.ico">
<script>
  // The app used to live here, and its links carry the view and run after
  // the '#' (mpactms.org/#review/r_...). The server never sees that part, so
  // forward it from the page.
  if (location.hash.length > 1) location.replace('https://app.mpactms.org/' + location.hash);
</script>
<style>
  :root { --bg: #f7f7f5; --text: #1d1f21; --muted: #5b6066; --accent: #1f8f84; --line: #d5d7d9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1d; --text: #e6e6e3; --muted: #9a9fa4; --accent: #2bb3a5; --line: #3a3d40; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; padding: 2rem 1rem; text-align: center; }
  /* The icon is white line art: darken it on the light background. */
  img { width: 56px; height: 56px; filter: invert(.85); }
  @media (prefers-color-scheme: dark) { img { filter: none; } }
  h1 { margin: .5rem 0 0; font-size: 2rem; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .tag { margin: .25rem 0 1.5rem; color: var(--muted); }
  p { margin: 0 0 1.75rem; }
  .links { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  a.button {
    display: inline-block; padding: .65rem 1.4rem; border-radius: 6px;
    border: 1px solid var(--line); color: inherit; text-decoration: none; font-weight: 600;
  }
  a.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.button:hover { filter: brightness(1.08); }
  footer { margin-top: 2.5rem; font-size: .875rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="/mpact-icon.png" alt="">
  <h1>M<span>PACT</span></h1>
  <div class="tag">Metabolomics Peak Analysis Computational Tool</div>
  <p>Filter, analyze and explore untargeted LC-MS metabolomics data from
     Progenesis QI, MZmine, MS-DIAL or Metaboscape, in Browser.</p>
  <div class="links">
    <a class="button primary" href="https://app.mpactms.org/">Open app</a>
    <a class="button" href="https://docs.mpactms.org/">Documentation</a>
  </div>
  <footer>
    Free and open source under GPLv3.
    <a href="https://github.com/robertsamples/mpact">Source code</a>
  </footer>
</main>
</body>
</html>
